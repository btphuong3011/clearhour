# Chạy test, lấy số đo trạm mới nhất từ OpenAQ, kiểm tra độ chính xác dự báo rồi đưa trang lên GitHub Pages.
# Chạy mỗi khi đẩy code lên main và mỗi giờ một lần để cập nhật data/stations.json
# và data/accuracy.json (không tạo commit mới, dữ liệu chỉ nằm trong bản deploy).

name: Deploy ClearHour

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Chạy test
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Kiểm thử giao diện và PWA trên Chrome
        if: github.event_name == 'push'
        run: npm run test:browser

      - name: Lấy số đo trạm từ OpenAQ
        run: node scripts/fetch-stations.mjs data/stations.json
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}

      # So dự báo với số đo trạm trong 60 ngày qua (kho lưu trữ công khai của OpenAQ, không cần key).
      # Bản trên web còn mới dưới 20 giờ thì dùng lại, lỗi thì vẫn deploy với tệp rỗng.
      - name: Kiểm tra độ chính xác dự báo
        run: node scripts/accuracy.mjs data/stations.json data/accuracy.json --reuse https://btphuong3011.github.io/clearhour/data/accuracy.json
        continue-on-error: true

      - name: Kiểm chứng quyết định từ bản dự báo đã lưu
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          archive="$(mktemp -d)"
          git fetch --no-tags --depth=1 origin refs/heads/forecast-archive
          git archive FETCH_HEAD snapshots | tar -xf - -C "$archive"
          node scripts/decision-benchmark.mjs "$archive/snapshots" data/decision-benchmark.json https://btphuong3011.github.io/clearhour/data/decision-benchmark.json

      - uses: actions/configure-pages@v6

      - name: Chuẩn bị bản phát hành
        shell: bash
        run: |
          set -euo pipefail
          pages="$RUNNER_TEMP/clearhour-pages"
          mkdir -p "$pages"
          git archive HEAD | tar -xf - -C "$pages"
          cp data/*.json "$pages/data/"
          sed -i "s/const BUILD = .dev.;/const BUILD = '$GITHUB_SHA';/" "$pages/sw.js"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/clearhour-pages

      - id: deployment
        uses: actions/deploy-pages@v5
